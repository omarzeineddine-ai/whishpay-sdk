name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC); no token is stored
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, which trusted publishing needs
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build # check:package inspects dist/
      - run: npm run check:package
      # prepublishOnly runs typecheck, lint, tests and build first.
      - run: npm publish
